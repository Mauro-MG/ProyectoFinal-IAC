[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abasto_api"
version = "1.0.0"
description = "Base común de los microservicios de AbastoRed: JSON/XML, errores, JWT, límites, bitácora, salud y OpenAPI"
requires-python = ">=3.11"
dependencies = [
    "abasto_dominio",
    "pydantic==2.9.2",
    "lxml==5.3.0",
    "swagger-ui-bundle==1.1.0",
    "gunicorn==22.0.0",
    "email-validator==2.2.0",
]

[tool.setuptools.packages.find]
include = ["abasto_api*"]


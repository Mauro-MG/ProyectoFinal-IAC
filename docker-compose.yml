      POSTGRES_USER: ms_busqueda
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_ms_busqueda
    secrets: [secret_key, jwt_secret_key, mongo_password, redis_password, pg_ms_busqueda]

  # ------------------------------------------------------------------ pruebas (bajo demanda)
  # docker compose --profile pruebas run --rm pruebas   → reporte en docs/pruebas/ (no hay que instalar Python)
  pruebas:
    profiles: [pruebas]
    build: {context: ., dockerfile: tests/Dockerfile}
    volumes:
      - .:/repo
    secrets: [jwt_secret_key]
    networks: [publica, datos]

  # ------------------------------------------------------------------ datos (red privada)
  # Emulador de Google Cloud Storage para desarrollo y pruebas (no se usa en Google Cloud). Los objetos
  # persisten en el volumen gcs-data. No valida firmas: la expiración de URLs se prueba contra el bucket real.
  gcs-emulador:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: abastored-gcs-emulador
    restart: unless-stopped
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem", "-filesystem-root", "/storage",
              "-public-host", "localhost", "-external-url", "http://gcs-emulador:4443"]
    volumes:
      - gcs-data:/storage
    networks: [datos, publica]   # publica: el gateway sirve las URLs firmadas en /almacenamiento/

  abastored-postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: abastored-postgres
    restart: unless-stopped
    # Hora de Monterrey para NOW() y las fechas sin zona (created_at); sin esto quedan en UTC
    command: postgres -c timezone=America/Monterrey
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    # Su superusuario y, para 06_contrasenas.sh, la contraseña de cada usuario de servicio
    secrets:
      - postgres_password
      - pg_ms_seguridad
      - pg_ms_comercios
      - pg_ms_catalogo
      - pg_ms_inventario
      - pg_ms_precios
      - pg_ms_pedidos
      - pg_ms_analisis
      - pg_ms_notificaciones
      - pg_ms_proveedores
      - pg_ms_abastecimiento
      - pg_ms_disponibilidad
      - pg_ms_geolocalizacion
      - pg_ms_sincronizacion
      - pg_ms_documentos
      - pg_ms_reportes
      - pg_ms_recomendaciones
      - pg_ms_demanda
      - pg_ms_ventas
      - pg_ms_entregas
      - pg_ms_auditoria
      - pg_ms_integraciones
      - pg_ms_configuracion
      - pg_ms_monitoreo
      - pg_ms_busqueda
      - pg_abastored_web
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  abastored-mongo:
    image: mongo:7.0
    container_name: abastored-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    secrets: [mongo_password]
    volumes:
      - mongo-data:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$(cat /run/secrets/mongo_password)\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  abastored-redis:
    image: redis:7.2-alpine
    container_name: abastored-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes:
      - redis-data:/data
      - ./db/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  secret_key:        {file: ./secrets/secret_key.txt}
  jwt_secret_key:    {file: ./secrets/jwt_secret_key.txt}
  postgres_password: {file: ./secrets/postgres_password.txt}
  mongo_password:    {file: ./secrets/mongo_password.txt}
  redis_password:    {file: ./secrets/redis_password.txt}
  # Usuarios de PostgreSQL por servicio (scripts/preparar_entorno.py los genera)
  pg_ms_seguridad:        {file: ./secrets/pg_ms_seguridad.txt}
  pg_ms_comercios:        {file: ./secrets/pg_ms_comercios.txt}
  pg_ms_catalogo:         {file: ./secrets/pg_ms_catalogo.txt}
  pg_ms_inventario:       {file: ./secrets/pg_ms_inventario.txt}
  pg_ms_precios:          {file: ./secrets/pg_ms_precios.txt}
  pg_ms_pedidos:          {file: ./secrets/pg_ms_pedidos.txt}
  pg_ms_analisis:         {file: ./secrets/pg_ms_analisis.txt}
  pg_ms_notificaciones:   {file: ./secrets/pg_ms_notificaciones.txt}
  pg_ms_proveedores:      {file: ./secrets/pg_ms_proveedores.txt}
  pg_ms_abastecimiento:   {file: ./secrets/pg_ms_abastecimiento.txt}
  pg_ms_disponibilidad:   {file: ./secrets/pg_ms_disponibilidad.txt}
  pg_ms_geolocalizacion:  {file: ./secrets/pg_ms_geolocalizacion.txt}
  pg_ms_sincronizacion:   {file: ./secrets/pg_ms_sincronizacion.txt}
  pg_ms_documentos:       {file: ./secrets/pg_ms_documentos.txt}
  pg_ms_reportes:         {file: ./secrets/pg_ms_reportes.txt}
  pg_ms_recomendaciones:  {file: ./secrets/pg_ms_recomendaciones.txt}
  pg_ms_demanda:          {file: ./secrets/pg_ms_demanda.txt}
  pg_ms_ventas:           {file: ./secrets/pg_ms_ventas.txt}
  pg_ms_entregas:         {file: ./secrets/pg_ms_entregas.txt}
  pg_ms_auditoria:        {file: ./secrets/pg_ms_auditoria.txt}
  pg_ms_integraciones:    {file: ./secrets/pg_ms_integraciones.txt}
  pg_ms_configuracion:    {file: ./secrets/pg_ms_configuracion.txt}
  pg_ms_monitoreo:        {file: ./secrets/pg_ms_monitoreo.txt}
  pg_ms_busqueda:         {file: ./secrets/pg_ms_busqueda.txt}
  pg_abastored_web:       {file: ./secrets/pg_abastored_web.txt}

networks:
  publica:
    driver: bridge
  datos:
    driver: bridge
    internal: true        # sin salida a internet ni puertos publicados: sólo la usan los contenedores

volumes:
  gcs-data:
  postgres-data:
  mongo-data:
  redis-data:

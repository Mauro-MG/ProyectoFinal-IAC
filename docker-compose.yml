# AbastoRed - Equipo 01
# Sistema web, 24 microservicios, PostgreSQL + PostGIS, MongoDB y Redis detrás de un gateway HTTPS.
#
#   python scripts/preparar_entorno.py   (una vez) crea .env y los secretos en secrets/
#   docker compose up --build -d         levantar
#   docker compose ps                    estado y salud de cada contenedor
#   docker compose down                  detener (conserva los datos)
#   docker compose down -v               detener y borrar los datos (recarga la carga inicial)
#
# Superficie de entrada: SÓLO el gateway publica puertos (80 redirige a 443).
#   https://localhost/                       sistema web
#   https://localhost/ms/<servicio>/docs     Swagger de cada microservicio
# Redes:
#   publica  gateway, web y microservicios
#   datos    (interna, sin acceso desde fuera de Docker) bases de datos, web y microservicios
# Secretos: archivos de secrets/ montados en /run/secrets; no viajan en variables de entorno.
#   Cada servicio entra a PostgreSQL con su propio usuario (ms_<servicio>, db/postgres/05_roles.sql) y
#   solo recibe SU contraseña (pg_ms_<servicio>); el web usa abastored_web, de solo lectura. La contraseña
#   del superusuario solo la tiene el contenedor de PostgreSQL.
# Archivos: Google Cloud Storage. En local se usa el emulador gcs-emulador (fake-gcs-server) con el mismo
#   cliente de GCS; en Google Cloud se deja vacío STORAGE_EMULATOR_HOST en .env y se usa el bucket real
#   (ver apps/infra/README.md). El bucket nunca es público: los archivos se entregan con URLs firmadas.
# Desarrollo: docker-compose.dev.yml publica además los puertos en 127.0.0.1 (sólo este equipo).

x-secretos-entorno: &secretos-entorno
  SECRET_KEY_FILE: /run/secrets/secret_key
  JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
  MONGO_PASSWORD_FILE: /run/secrets/mongo_password
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  # Cloud Storage (valores de .env; por omisión, el emulador local)
  GCS_BUCKET: ${GCS_BUCKET:-abastored-archivos}
  GCS_PROYECTO: ${GCS_PROYECTO:-abastored-local}
  GCS_CUENTA_FIRMA: ${GCS_CUENTA_FIRMA:-}
  STORAGE_EMULATOR_HOST: ${STORAGE_EMULATOR_HOST-http://gcs-emulador:4443}
  GCS_URL_PUBLICA: ${GCS_URL_PUBLICA:-https://localhost/almacenamiento}

x-microservicio: &microservicio
  env_file: .env
  restart: unless-stopped
  depends_on:
    abastored-postgres:
      condition: service_healthy
    abastored-mongo:
      condition: service_healthy
    abastored-redis:
      condition: service_healthy
  networks: [publica, datos]

services:
  # ------------------------------------------------------------------ entrada única
  gateway:
    build: {context: infra/gateway}
    container_name: abastored-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/certs:/etc/nginx/certs        # certificado autofirmado generado al primer arranque
    depends_on:
      - abastored-web          # los servicios se resuelven por DNS en cada petición: si uno falta, los demás siguen
    networks: [publica]

  # ------------------------------------------------------------------ sistema web
  abastored-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: abastored-web
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *secretos-entorno
      POSTGRES_USER: abastored_web                    # solo lectura: escribe por las APIs
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_abastored_web
      NOTIFICACIONES_VIA_SERVICIO: "true"
      ANALISIS_VIA_SERVICIO: "true"
    secrets: [secret_key, jwt_secret_key, mongo_password, redis_password, pg_abastored_web]
    depends_on:
      abastored-postgres:
        condition: service_healthy
      abastored-mongo:
        condition: service_healthy
      abastored-redis:
        condition: service_healthy
    networks: [publica, datos]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------ microservicios (24, puertos de desarrollo 8101-8124)
  ms-seguridad:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/seguridad/Dockerfile}
    container_name: ms-seguridad
    environment:
      <<: *secretos-entorno
      POSTGRES_USER: ms_seguridad
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_ms_seguridad
    secrets: [secret_key, jwt_secret_key, mongo_password, redis_password, pg_ms_seguridad]

  ms-comercios:

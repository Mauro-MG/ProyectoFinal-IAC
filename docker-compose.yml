# AbastoRed - Equipo 01
# Arquitectura completa en contenedores: sistema web, 8 microservicios,
# PostgreSQL + PostGIS, MongoDB y Redis en una red privada.
#
#   cp .env.example .env
#   docker compose up --build -d        levantar
#   docker compose ps                   estado y salud de cada contenedor
#   docker compose down                 detener (conserva los datos)
#   docker compose down -v              detener y borrar los datos (recarga la carga inicial)
#
# Puertos publicados en el equipo:
#   5000 web · 8101 seguridad · 8102 comercios · 8103 catálogo · 8104 inventario
#   8105 precios · 8106 pedidos · 8107 análisis · 8108 notificaciones
#   Swagger de cada servicio: http://localhost:81xx/docs

x-microservicio: &microservicio
  env_file: .env
  restart: unless-stopped
  depends_on:
    abastored-postgres:
      condition: service_healthy
    abastored-mongo:
      condition: service_healthy
    abastored-redis:
      condition: service_healthy
  networks:
    - abastored-network

services:
  # ------------------------------------------------------------------ sistema web
  abastored-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: abastored-web
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      NOTIFICACIONES_VIA_SERVICIO: "true"
      ANALISIS_VIA_SERVICIO: "true"
    depends_on:
      abastored-postgres:
        condition: service_healthy
      abastored-mongo:
        condition: service_healthy
      abastored-redis:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - ./libs:/libs
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------ microservicios
  ms-seguridad:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/seguridad/Dockerfile}
    container_name: ms-seguridad
    ports: ["8101:8000"]

  ms-comercios:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/comercios/Dockerfile}
    container_name: ms-comercios
    ports: ["8102:8000"]

  ms-catalogo:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/catalogo/Dockerfile}
    container_name: ms-catalogo
    ports: ["8103:8000"]

  ms-inventario:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/inventario/Dockerfile}
    container_name: ms-inventario
    ports: ["8104:8000"]

  ms-precios:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/precios/Dockerfile}
    container_name: ms-precios
    ports: ["8105:8000"]

  ms-pedidos:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/pedidos/Dockerfile}
    container_name: ms-pedidos
    ports: ["8106:8000"]

  ms-analisis:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/analisis/Dockerfile}
    container_name: ms-analisis
    ports: ["8107:8000"]

  ms-notificaciones:
    <<: *microservicio
    build: {context: ., dockerfile: apps/microservicios/notificaciones/Dockerfile}
    container_name: ms-notificaciones
    ports: ["8108:8000"]
    environment:
      NOTIFICACIONES_VIA_SERVICIO: "false"   # este servicio escribe directo en MongoDB

  # ------------------------------------------------------------------ datos
  abastored-postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: abastored-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  abastored-mongo:
    image: mongo:7.0
    container_name: abastored-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost:27017 --username ${MONGO_USER} --password ${MONGO_PASSWORD} --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  abastored-redis:
    image: redis:7.2-alpine
    container_name: abastored-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./db/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  abastored-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:

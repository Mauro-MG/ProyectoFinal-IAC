# AbastoRed - Equipo 01. Entorno de desarrollo local.
# Uso: cp .env.example .env && docker compose up --build

services:
  abastored-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: abastored-web
    ports:
      - "5000:5000"
    depends_on:
      abastored-postgres:
        condition: service_healthy
      abastored-mongo:
        condition: service_healthy
      abastored-redis:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env

  abastored-postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: abastored-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  abastored-mongo:
    image: mongo:7.0
    container_name: abastored-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost:27017 --username ${MONGO_USER} --password ${MONGO_PASSWORD} --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  abastored-redis:
    image: redis:7.2-alpine
    container_name: abastored-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./db/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - abastored-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  abastored-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:

# Gateway de AbastoRed: única entrada al sistema (HTTPS).
#   https://<host>/                     sistema web
#   https://<host>/ms/<servicio>/...    microservicios (API, /docs, /openapi.json, /xsd, /health)
# Las bases de datos no son alcanzables desde aquí: están en la red privada «datos».

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    server_tokens off;                      # no revelar la versión de nginx
    client_max_body_size 12m;               # archivos de hasta 10 MB + encabezados
    sendfile on;
    keepalive_timeout 65;
    # DNS interno de Docker; se vuelve a consultar cada 10 s (los contenedores cambian de IP al reiniciarse)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;                 # los reportes PDF/Excel pueden tardar algunos segundos

    # Formato de bitácora con el identificador de correlación de cada petición
    log_format principal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         '$request_time "$http_user_agent" cid=$http_x_correlation_id';
    access_log /var/log/nginx/access.log principal;

    # Límite global por IP en la entrada (cada servicio aplica además el suyo por usuario)
    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/abastored.crt;
        ssl_certificate_key /etc/nginx/certs/abastored.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # En un dominio real se agrega HSTS; en localhost obligaría HTTPS a otros proyectos locales:
        # add_header Strict-Transport-Security "max-age=31536000" always;

        limit_req zone=por_ip burst=60 nodelay;

        # Errores propios del gateway con el mismo formato JSON que los microservicios
        error_page 429 = @limite;
        error_page 502 503 504 = @no_disponible;
        location @limite {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-Limitado-Por gateway always;
            return 429 '{"error": {"codigo": "limite_excedido", "mensaje": "Demasiadas peticiones desde tu IP; intenta en un momento.", "status": 429}}';
        }
        location @no_disponible {
            default_type application/json;
            return 503 '{"error": {"codigo": "servicio_no_disponible", "mensaje": "El servicio no responde en este momento.", "status": 503}}';
        }

        # Con variable, nginx resuelve el nombre en cada petición (DNS de Docker): si el web se reinicia y cambia
        # de IP, el gateway lo sigue encontrando sin reiniciarse.
        location / {
            include /etc/nginx/encabezados_proxy.conf;
            set $web abastored-web:5000;
            proxy_pass http://$web;
        }

        # Los 24 microservicios: /ms/<servicio>/<resto> -> http://ms-<servicio>:8000/<resto>
        # Sólo los nombres de la lista (no se puede alcanzar otro contenedor por esta ruta). El nombre se
        # resuelve en cada petición con el DNS de Docker: si un servicio está caído o todavía no arranca, el
        # gateway sigue funcionando para los demás y ese servicio responde 503 en JSON.
        location ~ ^/ms/(?<servicio>seguridad|comercios|catalogo|inventario|precios|pedidos|analisis|notificaciones|proveedores|abastecimiento|disponibilidad|geolocalizacion|sincronizacion|documentos|reportes|recomendaciones|demanda|ventas|entregas|auditoria|integraciones|configuracion|monitoreo|busqueda)/(?<resto>.*)$ {
            include /etc/nginx/encabezados_proxy.conf;
            proxy_set_header X-Forwarded-Prefix /ms/$servicio;
            proxy_pass http://ms-$servicio:8000/$resto$is_args$args;
        }
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6570"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="700.0" y="40" font-size="24" font-weight="700" fill="#1F2933" text-anchor="middle">Autenticación: JWT con sesión verificada en Redis</text><text x="700.0" y="66" font-size="14" font-weight="400" fill="#5B6570" text-anchor="middle">libs/abasto_dominio/abasto_dominio/sesiones.py y libs/abasto_api/abasto_api/seguridad.py</text><rect x="8.0" y="86" width="164" height="56" rx="8" fill="#fff" stroke="#8A939C" stroke-width="1.6"/><text x="90.0" y="110" font-size="14.5" font-weight="700" fill="#1F2933" text-anchor="middle">Cliente</text><text x="90.0" y="129" font-size="12" font-weight="400" fill="#5B6570" text-anchor="middle">web, Android, escritorio</text><line x1="90.0" y1="142" x2="90.0" y2="830" stroke="#C4CAD0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="414.6666666666667" y="86" width="164" height="56" rx="8" fill="#E7F0EA" stroke="#1E5B3E" stroke-width="1.6"/><text x="496.6666666666667" y="110" font-size="14.5" font-weight="700" fill="#1F2933" text-anchor="middle">ms-seguridad</text><text x="496.6666666666667" y="129" font-size="12" font-weight="400" fill="#5B6570" text-anchor="middle">8101</text><line x1="496.6666666666667" y1="142" x2="496.6666666666667" y2="830" stroke="#C4CAD0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="821.3333333333334" y="86" width="164" height="56" rx="8" fill="#F4EBD8" stroke="#9A7322" stroke-width="1.6"/><text x="903.3333333333334" y="110" font-size="14.5" font-weight="700" fill="#1F2933" text-anchor="middle">Redis</text><text x="903.3333333333334" y="129" font-size="12" font-weight="400" fill="#5B6570" text-anchor="middle">sesiones</text><line x1="903.3333333333334" y1="142" x2="903.3333333333334" y2="830" stroke="#C4CAD0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1228.0" y="86" width="164" height="56" rx="8" fill="#E7F0EA" stroke="#1E5B3E" stroke-width="1.6"/><text x="1310.0" y="110" font-size="14.5" font-weight="700" fill="#1F2933" text-anchor="middle">Otro servicio</text><text x="1310.0" y="129" font-size="12" font-weight="400" fill="#5B6570" text-anchor="middle">p. ej. ms-pedidos</text><line x1="1310.0" y1="142" x2="1310.0" y2="830" stroke="#C4CAD0" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="90.0" y1="180" x2="492.6666666666667" y2="180" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="293.33333333333337" y="172" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">POST /auth/login (correo, contraseña)</text><circle cx="68.0" cy="176" r="11" fill="#1E5B3E"/><text x="68.0" y="181" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><path d="M496.6666666666667,224 h40 v18 h-36" fill="none" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><text x="544.6666666666667" y="238" font-size="13" font-weight="400" fill="#1F2933" text-anchor="start">bcrypt; 5 fallos en 15 min → cuenta bloqueada</text><line x1="496.6666666666667" y1="280" x2="899.3333333333334" y2="280" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="700.0" y="272" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">SETEX sesion:{jti} 8 h · refresh:{token} 7 días</text><line x1="496.6666666666667" y1="330" x2="94.0" y2="330" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)" stroke-dasharray="6 4"/><text x="293.33333333333337" y="322" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">access_token (JWT HS256, 8 h) + refresh_token</text><line x1="90.0" y1="380" x2="1306.0" y2="380" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="700.0" y="372" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">GET /api/v1/pedidos  Authorization: Bearer …</text><circle cx="68.0" cy="376" r="11" fill="#1E5B3E"/><text x="68.0" y="381" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="1310.0" y1="430" x2="907.3333333333334" y2="430" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="1106.6666666666667" y="422" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">firma y vigencia → ¿jwt:revocado:{jti}? → ¿existe sesion:{jti}?</text><path d="M1310.0,474 h-40 v18 h36" fill="none" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><text x="1262.0" y="488" font-size="13" font-weight="400" fill="#1F2933" text-anchor="end">permiso del rol en el token (403 si falta)</text><line x1="1310.0" y1="530" x2="94.0" y2="530" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)" stroke-dasharray="6 4"/><text x="700.0" y="522" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">200 (o 401 / 403 / 429 / 503 si Redis no responde)</text><line x1="90.0" y1="580" x2="492.6666666666667" y2="580" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="293.33333333333337" y="572" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">POST /auth/renovar (refresh de un solo uso)</text><circle cx="68.0" cy="576" r="11" fill="#1E5B3E"/><text x="68.0" y="581" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="496.6666666666667" y1="630" x2="899.3333333333334" y2="630" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="700.0" y="622" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">GETDEL refresh:{token}; revoca el acceso anterior; emite par nuevo</text><line x1="90.0" y1="680" x2="492.6666666666667" y2="680" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="293.33333333333337" y="672" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">POST /auth/logout</text><circle cx="68.0" cy="676" r="11" fill="#1E5B3E"/><text x="68.0" y="681" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="496.6666666666667" y1="730" x2="899.3333333333334" y2="730" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="700.0" y="722" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">borra sesion:{jti} y su refresh; SETEX jwt:revocado:{jti}</text><rect x="30" y="756" width="1340" height="34" rx="6" fill="#FAFAF7" stroke="#D9D4C3" stroke-width="1"/><text x="700.0" y="778" font-size="13.5" font-weight="600" fill="#9A7322" text-anchor="middle">Cerrar sesión o desactivar al usuario invalida el token en los 24 servicios y en el web a la vez: todos consultan el mismo Redis.</text></svg>
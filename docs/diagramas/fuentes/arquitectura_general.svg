 text-anchor="middle">respaldos · URL firmadas V4</text><line x1="1300" y1="740" x2="1360" y2="808" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><path d="M60,440 H32 V865 H56" fill="none" stroke="#3C7A5A" stroke-width="1.4" marker-end="url(#f)" stroke-dasharray="5 4"/><text x="36" y="800" font-size="12" font-weight="600" fill="#3C7A5A" text-anchor="start">SELECT</text><text x="800" y="975" font-size="14" font-weight="400" fill="#5B6570" text-anchor="middle" font-style="italic">En local, Cloud Storage se sustituye por un emulador; en Google Cloud se usa el bucket real.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6570"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800" y="44" font-size="28" font-weight="700" fill="#1F2933" text-anchor="middle">AbastoRed: arquitectura general</text><text x="800" y="72" font-size="16" font-weight="400" fill="#5B6570" text-anchor="middle">Una sola entrada HTTPS · 24 servicios dueños de sus datos · dos bibliotecas compartidas</text><rect x="120" y="100" width="310" height="70" rx="8" fill="#fff" stroke="#8A939C" stroke-width="1.5"/><text x="275.0" y="128" font-size="17" font-weight="600" fill="#1F2933" text-anchor="middle">Navegador</text><text x="275.0" y="150" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">web por rol + sitio público</text><line x1="275" y1="170" x2="800" y2="222" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><rect x="470" y="100" width="310" height="70" rx="8" fill="#fff" stroke="#8A939C" stroke-width="1.5"/><text x="625.0" y="128" font-size="17" font-weight="600" fill="#1F2933" text-anchor="middle">App Android</text><text x="625.0" y="150" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">Kotlin · solo JSON · sin conexión</text><line x1="625" y1="170" x2="800" y2="222" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><rect x="820" y="100" width="310" height="70" rx="8" fill="#fff" stroke="#8A939C" stroke-width="1.5"/><text x="975.0" y="128" font-size="17" font-weight="600" fill="#1F2933" text-anchor="middle">App de escritorio</text><text x="975.0" y="150" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">PySide6 · solo XML con XSD</text><line x1="975" y1="170" x2="800" y2="222" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><rect x="1170" y="100" width="310" height="70" rx="8" fill="#fff" stroke="#8A939C" stroke-width="1.5"/><text x="1325.0" y="128" font-size="17" font-weight="600" fill="#1F2933" text-anchor="middle">Postman / Swagger</text><text x="1325.0" y="150" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">contratos y pruebas</text><line x1="1325" y1="170" x2="800" y2="222" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><rect x="470" y="225" width="660" height="74" rx="8" fill="#E7F0EA" stroke="#1E5B3E" stroke-width="2"/><text x="800" y="256" font-size="19" font-weight="700" fill="#1E5B3E" text-anchor="middle">Gateway nginx (HTTPS 443)</text><text x="800" y="280" font-size="14" font-weight="400" fill="#5B6570" text-anchor="middle">TLS 1.2/1.3 · 30 peticiones/s por IP · /  → web · /ms/&lt;servicio&gt;/ → microservicio</text><line x1="640" y1="299" x2="230" y2="350" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><line x1="800" y1="299" x2="800" y2="350" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><rect x="60" y="352" width="340" height="128" rx="8" fill="#fff" stroke="#3C7A5A" stroke-width="1.5"/><text x="230.0" y="380" font-size="17" font-weight="600" fill="#1F2933" text-anchor="middle">abastored-web</text><text x="230.0" y="402" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">Flask · plantillas + Highcharts</text><text x="230.0" y="421" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">lee PostgreSQL con usuario</text><text x="230.0" y="440" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">de solo lectura</text><text x="230.0" y="459" font-size="13.5" font-weight="400" fill="#5B6570" text-anchor="middle">escribe solo por las APIs</text><line x1="400" y1="416" x2="455" y2="416" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><rect x="458" y="340" width="1082" height="400" rx="10" fill="#F5F6F5" stroke="#8A939C" stroke-width="1.5" stroke-dasharray="6 4"
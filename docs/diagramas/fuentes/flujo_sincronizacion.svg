peración con el token del usuario</text><circle cx="474.6666666666667" cy="376" r="11" fill="#1E5B3E"/><text x="474.6666666666667" y="381" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="903.3333333333334" y1="430" x2="500.6666666666667" y2="430" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)" stroke-dasharray="6 4"/><text x="700.0" y="422" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">aplicada · duplicada (misma respuesta) · 409 conflicto · 503</text><line x1="496.6666666666667" y1="480" x2="1306.0" y2="480" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)"/><text x="903.3333333333334" y="472" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">guarda el estado de cada operación</text><line x1="496.6666666666667" y1="530" x2="94.0" y2="530" stroke="#4B5563" stroke-width="1.6" marker-end="url(#f)" stroke-dasharray="6 4"/><text x="293.33333333333337" y="522" font-size="13" font-weight="400" fill="#1F2933" text-anchor="middle">resultado por operación: aplicada, conflicto, pendiente_reintento</text><circle cx="68.0" cy="526" r="11" fill="#1E5B3E"/><text x="68.0" y="531" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M90.0,574 h40 v18 h-36" fill="none" stroke="#8A939C" stroke-width="1.6" marker-end="url(#f)"/><text x="138.0" y="588" font-size="13" font-weight="400" fill="#1F2933" text-anchor="start">el usuario revisa los conflictos en «Pendientes»</text><text x="30" y="672" font-size="13" font-weight="400" fill="#5B6570" text-anchor="start" font-style="italic">Conflicto de precio: si el servidor cambió el precio después de version_base, la operación no se aplica y queda como conflicto.</text></svg>
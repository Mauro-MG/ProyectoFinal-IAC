" font-size="13.5" font-weight="600" fill="#9A7322" text-anchor="middle">Cada paso registra su evento de auditoría en la misma transacción y lleva el mismo X-Correlation-ID (GET /trazas/{id} en ms-auditoria).</text><text x="30" y="1054" font-size="13" font-weight="400" fill="#5B6570" text-anchor="start" font-style="italic">Si un paso intermedio falla, el pedido o la entrega no cambian de estado y el reintento usa la misma referencia; el dueño no repite el cambio.</text></svg>